[package]
name = "lunabot-cu"
version = "0.1.0"
edition = "2024"
default-run = "lunabot"
build = "build.rs"

# Enhanced debugging support for procedural macros
[profile.dev]
debug = 2
incremental = false

# The main executable of your application
[[bin]]
name = "lunabot"
path = "src/main.rs"

# A custom made log reader application for your application.
[[bin]]
name = "lunabot-logreader"
path = "src/logreader.rs"
required-features = ["logreader"]

[features]
production = [
    "cu-apriltag/hardware",
    "udev",
    "gstreamer",
    "gstreamer-app",
    "cu-gstreamer",
    "circular-buffer",
    "launcher",
    "tokio-serial",
    "vesc-translator",
    "cakap2",
    "mio",
]
logreader = ["dep:cu29-export"]
resim = ["dep:cu29-export", "cu-apriltag/resim"]
sim = []

[[bin]]
name = "lunabot-resim"
path = "src/resim.rs"
required-features = ["resim"]

[dependencies]

# copper
cu29.workspace = true
bincode.workspace = true
cu29-helpers.workspace = true
cu29-export = { workspace = true, optional = true }
# cu_cursiveconsolemon.workspace = true
# cu-consolemon.workspace = true
cu-sensor-payloads.workspace = true
cu-spatial-payloads.workspace = true
cu29-runtime.workspace = true
cu-apriltag.workspace = true

crossbeam-channel = "0.5"
anyhow = "1"
serde.workspace = true
iceoryx2.workspace = true
# libc = "0.2.173"
# nix = { version = "0.30.1", features = ["time"] }
bytemuck.workspace = true
nalgebra.workspace = true
kiss-icp-core = { path = "../kiss-icp-rs/core" }
kiss-icp-ops = { path = "../kiss-icp-rs/ops" }
rayon = "1.10"

crossbeam.workspace = true

rerun = { version = "0.23.2", features = [
    "nasm",
    "sdk",
], default-features = false }
chrono = "0.4.41"

# Pin unicode-width to 0.2.0 to resolve version conflict between ratatui (requires =0.2.0) and pfetch (allows ^0.2)
unicode-width = "=0.2.0"

# embedded
embedded_common = { path = "../embedded_common" }

# RON deserialization at runtime
ron.workspace = true
spin_sleep = "1.3.2"

# misc
simple-motion = { path = "../misc/simple-motion" }
cakap2 = { path = "../misc/cakap2", optional = true }
bitcode = "0.6.6"
tasker = { path = "../misc/tasker" }
iceoryx-types = { path = "../misc/iceoryx-types" }
launcher = { path = "../misc/launcher", optional = true }
vesc-translator = { path = "../misc/vesc-translator", optional = true }

# common
common = { path = "../common" }

tokio-serial = { workspace = true, optional = true }
futures-util.workspace = true
tokio-util.workspace = true
cobs = "0.4.0"
bytes = "1.10.1"
mio = { version = "1.0.4", optional = true }
fxhash.workspace = true
bonsai-bt = { git = "https://github.com/Sollimann/bonsai.git", features = [
    "visualize",
] }

# production hardware feature only
udev = { version = "0.9", features = ["mio10"], optional = true }
gstreamer = { version = "0.24.0", optional = true }
circular-buffer = { version = "1.1.0", optional = true }
gstreamer-app = { version = "0.24.0", optional = true }
cu-gstreamer = { workspace = true, optional = true }


[build-dependencies]
ron.workspace = true
serde.workspace = true
