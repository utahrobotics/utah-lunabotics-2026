[package]
name = "lunabase-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["lazy-function-tables", "api-4-6"] }
common = { path = "../common" }
quic = { path = "../misc/quic" }
tasker = { path = "../misc/tasker" }

[lib]
crate-type = ["cdylib"] # Compile this crate to a dynamic C library.
