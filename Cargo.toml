[workspace]
resolver = "3"
members = [
    "misc/rerun-types-wrapper",
    "misc/simple-motion",
    "misc/cakap2",
    "misc/tasker",
    "misc/thalassic",
    "misc/gputter",
    "misc/iceoryx-types",
    "misc/launcher",
    "misc/vesc-translator",
    "common",
    "lunabot-cu",
    "embedded_common",
    "external-tasks/realsense",
    "external-tasks/lunabot-ai2",
]
exclude = ["kiss-icp-rs"]
# Shared dependencies across workspace members
[workspace.dependencies]
cu29 = { path = "/home/matthew_a/copper-rs/core/cu29", package = "cu29", features = [
    "log-level-info",
    "log-level-error",
] }
bincode = { version = "2", features = ["derive", "serde"] }
cu29-helpers = { path = "/home/matthew_a/copper-rs/core/cu29_helpers" }
cu-apriltag = { path = "/home/matthew_a/copper-rs/components/tasks/cu_apriltag" }
cu_cursive_consolemon = { path = "/home/matthew_a/copper-rs/components/monitors/cu_cursive_consolemon" }
# cu-consolemon = { path = "/home/matthew_a/copper-rs/components/monitors/cu_consolemon" }
cu-sensor-payloads = { path = "/home/matthew_a/copper-rs/components/payloads/cu_sensor_payloads" }
cu-spatial-payloads = { path = "/home/matthew_a/copper-rs/components/payloads/cu_spatial_payloads", features = [
    "nalgebra",
] }
cu-dynthreshold = { path = "/home/matthew_a/copper-rs/components/tasks/cu_dynthreshold", features = [
    "gst",
] }
cu29-runtime = { path = "/home/matthew_a/copper-rs/core/cu29_runtime" }
cu-gstreamer = { path = "/home/matthew_a/copper-rs/components/sources/cu_gstreamer", features = [
    "gst",
] }
iceoryx2 = { version = "0.6.1" }
crossbeam = "0.8"

nalgebra = { version = "0.33", features = [
    "serde-serialize",
    "convert-bytemuck",
] }

ron = { version = "=0.10.1", features = ["indexmap"] }
fxhash = "0.2.1"
indexmap = "2.9.0"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12.2"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
anyhow = "1"
unfmt = "0.2.2"
serde = { version = "1", features = ["derive"] }

tokio-serial = "5.4.5"
tokio-util = "0.7.16"
futures-util = "0.3.31"


# Workspace-level metadata
[workspace.metadata]
# You can add custom metadata here if needed
